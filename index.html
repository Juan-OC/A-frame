<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Casa 3D - A-Frame</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@4.2.0/dist/aframe-physics-system.min.js"></script>
</head>

<body>

<a-scene>

     <a-assets>
    <a-asset-item id="tree" src="modelos/mewgenics_cat_3d_model.glb"></a-asset-item>
  </a-assets>

  <a-entity gltf-model="#tree"></a-entity>


    <!-- =========================
         TERRENO
    ========================== -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#4CAF50">
    </a-plane>
    


    <!-- =========================
         CASA
    ========================== -->

    <!-- Cuerpo principal -->
    <a-box
        position="0 2 -5"
        width="6"
        height="4"
        depth="5"
        color="#F2D2A9">
    </a-box>

    
<!-- cielo -->
    <a-sky src="img360.jpg" rotation="0 -130 0"></a-sky>

      <a-text font="kelsonsans" value="Puy de Sancy, France" width="6" position="-2.5 0.25 -1.5"
              rotation="0 15 0"></a-text>


    <!-- Techo -->
    <a-entity
        position="0 4.8 -5"
        rotation="0 0 0">

        <!-- Lado izquierdo del techo -->
        <a-box
            position="-2 0 0"
            width="5.5"
            height="0.5"
            depth="5.5"
            rotation="0 0 45"
            color="#8B4513">
        </a-box>

        <!-- Lado derecho del techo -->
        <a-box
            position="2 0 0"
            width="5.5"
            height="0.5"
            depth="5.5"
            rotation="0 0 -45"
            color="#8B4513">
        </a-box>

    </a-entity>


    <!-- =========================
         PUERTA
    ========================== -->

    <a-box
        position="0 1.2 -7.53"
        width="1.3"
        height="2.4"
        depth="0.15"
        color="#5D4037">
    </a-box>


    <!-- Perilla -->
    <a-sphere
        position="0.4 1.2 -7.65"
        radius="0.08"
        color="#FFD700">
    </a-sphere>


    <!-- =========================
         VENTANAS
    ========================== -->

    <!-- Ventana izquierda -->
    <a-box
        position="-2 2.3 -7.55"
        width="1.3"
        height="1.3"
        depth="0.15"
        color="#5DADE2">
    </a-box>

    <!-- Marco vertical -->
    <a-box
        position="-2 2.3 -7.65"
        width="0.1"
        height="1.4"
        depth="0.1"
        color="white">
    </a-box>

    <!-- Marco horizontal -->
    <a-box
        position="-2 2.3 -7.65"
        width="1.4"
        height="0.1"
        depth="0.1"
        color="white">
    </a-box>


    <!-- Ventana derecha -->
    <a-box
        position="2 2.3 -7.55"
        width="1.3"
        height="1.3"
        depth="0.15"
        color="#5DADE2">
    </a-box>

    <!-- Marco vertical -->
    <a-box
        position="2 2.3 -7.65"
        width="0.1"
        height="1.4"
        depth="0.1"
        color="white">
    </a-box>

    <!-- Marco horizontal -->
    <a-box
        position="2 2.3 -7.65"
        width="1.4"
        height="0.1"
        depth="0.1"
        color="white">
    </a-box>


    <!-- =========================
         CAMINO
    ========================== -->

    <a-plane
        position="0 0.02 -10"
        rotation="-90 0 0"
        width="2"
        height="6"
        color="#BDBDBD">
    </a-plane>


    <!-- =========================
         NUBES
    ========================== -->

    <!-- Nube 1 -->
    <a-entity position="-7 8 -10">

        <a-sphere
            position="0 0 0"
            radius="1"
            color="white">
        </a-sphere>

        <a-sphere
            position="1.2 0 0"
            radius="1.3"
            color="white">
        </a-sphere>

        <a-sphere
            position="2.4 0 0"
            radius="0.9"
            color="white">
        </a-sphere>

        <a-sphere
            position="1.2 0.7 0"
            radius="1"
            color="white">
        </a-sphere>

    </a-entity>


    <!-- Nube 2 -->
    <a-entity position="6 10 -15">

        <a-sphere
            position="0 0 0"
            radius="1"
            color="white">
        </a-sphere>

        <a-sphere
            position="1.2 0 0"
            radius="1.4"
            color="white">
        </a-sphere>

        <a-sphere
            position="2.5 0 0"
            radius="1"
            color="white">
        </a-sphere>

        <a-sphere
            position="1.3 0.7 0"
            radius="1"
            color="white">
        </a-sphere>

    </a-entity>

    <!-- =========================
<!-- =========================
     VACA
========================== -->

<a-entity
    id="vaca"
    position="7 0 -5"

    animation__bounce="
        property: position;
        from: 7 0 -5;
        to: 7 0.25 -5;
        dur: 350;
        dir: alternate;
        loop: true;
        easing: easeInOutSine
    "

    animation__sway="
        property: rotation;
        from: 0 0 -8;
        to: 0 0 8;
        dur: 350;
        dir: alternate;
        loop: true;
        easing: easeInOutSine
    ">
    <!-- =========================
         CUERPO
    ========================== -->

    <a-sphere
        id="cuerpo"
        position="0 1.5 0"
        scale="1.5 0.9 0.8"
        color="#F5F5F5">
    </a-sphere>


    <!-- =========================
         MANCHAS DEL CUERPO
    ========================== -->

    <a-sphere
        id="mancha-cuerpo-1"
        position="-0.7 1.7 -0.55"
        scale="0.45 0.35 0.15"
        color="#333333">
    </a-sphere>

    <a-sphere
        id="mancha-cuerpo-2"
        position="0.5 1.3 0.35"
        scale="0.4 0.3 0.15"
        color="#333333">
    </a-sphere>


    <!-- =========================
         CUELLO
    ========================== -->

    <a-entity
        id="cuello"
    position="1.15 1.9 0"

    animation__cabeza="
        property: rotation;
        from: 0 0 18;
        to: 0 0 -18;
        dur: 320;
        dir: alternate;
        loop: true;
        easing: easeInOutSine">

        <a-cylinder
            position="0 0 0"
            radius="0.45"
            height="1.2"
            color="#F5F5F5">
        </a-cylinder>


        <!-- =========================
             CABEZA
        ========================== -->

        <a-entity
            id="cabeza"
            position="0 0.75 0">

            <a-sphere
                position="0 0 0"
                scale="0.8 0.65 0.65"
                color="#F5F5F5">
            </a-sphere>


            <!-- Mancha de la cabeza -->

            <a-sphere
                position="0.2 0.15 -0.5"
                scale="0.3 0.3 0.12"
                color="#333333">
            </a-sphere>


            <!-- Hocico -->

            <a-sphere
                position="0 -0.2 -0.58"
                scale="0.45 0.3 0.25"
                color="#E8A6A6">
            </a-sphere>


            <!-- =========================
                 CUERNOS
            ========================== -->

            <a-cone
                position="-0.45 0.5 0"
                radius-bottom="0.15"
                radius-top="0"
                height="0.45"
                color="#D2B48C">
            </a-cone>

            <a-cone
                position="0.45 0.5 0"
                radius-bottom="0.15"
                radius-top="0"
                height="0.45"
                color="#D2B48C">
            </a-cone>


            <!-- =========================
                 OREJAS
            ========================== -->

            <a-sphere
                position="-0.6 0.2 0"
                scale="0.35 0.15 0.25"
                color="#F5F5F5">
            </a-sphere>

            <a-sphere
                position="0.6 0.2 0"
                scale="0.35 0.15 0.25"
                color="#F5F5F5">
            </a-sphere>

        </a-entity>

    </a-entity>


    <!-- =========================
         PATAS
    ========================== -->

    <!-- Pata delantera izquierda -->

    <a-entity
        id="pata-delantera-izquierda"
    position="-0.6 1.4 0"

    animation__pierna="
        property: rotation;
        from: 0 0 -28;
        to: 0 0 28;
        dur: 320;
        dir: alternate;
        loop: true;
        easing: easeInOutSine">

        <a-cylinder
            position="0 -0.7 0"
            radius="0.18"
            height="1.4"
            color="#F5F5F5">
        </a-cylinder>

    </a-entity>


    <!-- Pata delantera derecha -->

    <a-entity
        id="pata-delantera-derecha"
        position="0.2 1.4 0">

        <a-cylinder
            position="0 -0.7 0"
            radius="0.18"
            height="1.4"
            color="#F5F5F5">
        </a-cylinder>

    </a-entity>


    <!-- Pata trasera izquierda -->

    <a-entity
        id="pata-trasera-izquierda"
        position="0.9 1.4 0">

        <a-cylinder
            position="0 -0.7 0"
            radius="0.18"
            height="1.4"
            color="#F5F5F5">
        </a-cylinder>

    </a-entity>


    <!-- Pata trasera derecha -->

    <a-entity
        id="pata-trasera-derecha"
    position="1.6 1.4 0"

    animation__pierna="
        property: rotation;
        from: 0 0 -28;
        to: 0 0 28;
        dur: 320;
        dir: alternate;
        loop: true;
        easing: easeInOutSine">

        <a-cylinder
            position="0 -0.7 0"
            radius="0.18"
            height="1.4"
            color="#F5F5F5">
        </a-cylinder>

    </a-entity>

</a-entity>


    <!-- =========================
         ILUMINACIÓN
    ========================== -->

    <!-- Luz ambiental -->
    <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="1.5">
    </a-light>

    <!-- Sol -->
    <a-light
        type="directional"
        position="-5 10 5"
        rotation="-45 -30 0"
        color="#FFFFFF"
        intensity="2">
    </a-light>


    <!-- =========================
         CÁMARA
    ========================== -->

    <a-camera
        position="0 2 4"
        look-controls>
    </a-camera>


   
</a-scene>

</body>
</html>
